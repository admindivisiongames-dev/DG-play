<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Settings — Division</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="settings">
  <!-- EDITABLE SETTINGS PAGE: all labels and forms are plain HTML. JS fills account values and handles saving. -->
  <template id="settings-template">
    <div class="page">
      <div class="eyebrow">Your account</div><h1 class="page-title">Settings</h1><p class="muted">Make Division feel like yours.</p><p class="muted">Profile and preferences are saved to your Division account.</p>
      <div class="settings-layout" style="margin-top:25px">
        <nav class="side-menu panel"><a class="active" href="#account">Account</a><a href="#preferences">Preferences</a><a href="#privacy">Privacy</a></nav>
        <div class="panel">
          <section id="account"><h2>Account details</h2><p class="muted">Update how you appear to other players.</p>
            <form id="profileForm" class="form-stack"><label>Display name<input class="field" name="username" value="" placeholder="Enter username" minlength="3" maxlength="20" required><small class="muted" id="usernameCooldownHint">You can change your username once every 30 days.</small></label><label>Email<input class="field" name="email" type="email" value="" placeholder="Enter email address" required></label><label>Biography<textarea class="field" name="bio" rows="3" maxlength="160" placeholder="Write a short bio..."></textarea></label><button class="btn primary" type="submit">Save changes</button></form>
          </section>
          <section id="password"><h2>Password &amp; security</h2><form id="passwordForm" class="form-stack"><label>New password<input class="field" id="newPassword" type="password" minlength="8" required></label><button class="btn primary" type="submit">Update password</button></form></section>
          <section id="panic-settings"><h2>Panic Key</h2><p class="muted">Choose the website that opens when you press Panic Key. If you skip, Google Classroom is used. Saved on this browser.</p><form id="panicSettingsForm" class="form-stack"><label>Destination URL<input class="field" id="panicSettingsUrl" name="panicUrl" type="url" inputmode="url" placeholder="Enter destination URL (https://...)" value="" required></label><button class="btn primary" type="submit">Save Panic Key URL</button><button class="btn ghost" id="panicSettingsClassroom" type="button">Reset to Google Classroom</button><button class="btn ghost" id="panicSettingsTutorial" type="button">Show Panic Key introduction again</button></form></section>
          <section id="preferences"><h2>Preferences</h2><div class="setting-row"><div><b>Sound effects</b><div class="muted">Allow game interface sounds</div></div><button class="switch on" data-setting="sound" aria-label="Toggle sound"></button></div><div class="setting-row"><div><b>Reduced motion</b><div class="muted">Use calmer animations</div></div><button class="switch" data-setting="motion" aria-label="Toggle reduced motion"></button></div></section>
          <section id="privacy"><h2>Privacy &amp; security</h2><div class="setting-row"><div><b>Public profile</b><div class="muted">Let other players see your profile</div></div><button class="switch on" data-setting="public" aria-label="Toggle public profile"></button></div><div class="setting-row"><div><b>Sign out</b><div class="muted">Sign out of this browser</div></div><button class="btn" id="logout">Sign out</button></div></section>
        </div>
      </div>
    </div>
  </template>
  <div class="shell" id="division-shell"><header id="division-header"></header><main id="app"></main><footer id="division-footer"></footer></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="supabase-client.js" defer></script><script src="app.js" defer></script>
</body></html>
