<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Create Account — Division</title><link rel="stylesheet" href="styles.css"></head><body data-page="signup">
  <!-- EDITABLE SIGNUP PAGE: update the wording and form directly in HTML. -->
  <template id="auth-template"><div class="auth-wrap"><aside class="auth-side"><!-- AUTH_BRAND --><div><div class="eyebrow">Welcome to Division</div><h1>Your next<br>great <span>break</span><br>starts here.</h1><p class="muted">A little play goes a long way.</p></div><small class="muted">© 2026 Division</small></aside><main class="auth-main"><div class="auth-box"><a class="muted" href="index.html">← Back to Division</a><h2 style="margin-top:30px">Create your account</h2><p class="muted">Join the community and keep your games in one place.</p><form class="form-stack" id="authForm"><label>Username<input class="field" name="username" minlength="3" maxlength="20" placeholder="Your player name" required></label><label>Email address<input class="field" type="email" name="email" placeholder="you@example.com" required></label><label>Password<input class="field" type="password" name="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></label><label>Confirm password<input class="field" type="password" name="confirmPassword" minlength="8" autocomplete="new-password" placeholder="Enter your password again" required></label><label class="split"><span style="display:flex;gap:9px;align-items:center"><input type="checkbox" required> I agree to the community rules</span></label><button class="btn primary" type="submit">Create account →</button></form><p class="muted" style="text-align:center">Already have an account? <a href="login.html" style="color:var(--orange)">Log in</a></p><p class="muted" style="font-size:11px;text-align:center">Secure sign-in and account verification are handled by Supabase.</p></div></main></div></template>
  <div class="shell" id="division-shell"><header id="division-header"></header><main id="app"></main><footer id="division-footer"></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="supabase-client.js" defer></script><script src="app.js" defer></script></body></html>
